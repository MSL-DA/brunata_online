name: Pytest

on:
  push:
    branches:
      - "main"
      - "beta"
  pull_request:
    branches:
      - "main"
      - "beta"

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The matrix declares Home Assistant versions, not
        # pytest-homeassistant-custom-component versions.
        #
        # Every phcc release pins one exact homeassistant release as a
        # dependency, so pinning homeassistant here lets pip resolve the
        # matching phcc release by itself. That removes the phcc-to-HA lookup
        # table this file used to carry, which was a standing source of error:
        # the two version schemes look nothing alike and a wrong pin fails
        # silently by testing the wrong version green.
        #
        # First entry must match "homeassistant" in hacs.json — that is the
        # version advertised to every HACS user, and this job is what makes the
        # promise true. tests/test_manifest.py asserts the two agree.
        ha_version:
          - "2025.8.0"    # minimum declared in hacs.json (OptionsFlowWithReload)
          - "2026.8.2"    # current, matches requirements_test.txt

    name: "HA ${{ matrix.ha_version }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "homeassistant==${{ matrix.ha_version }}" \
            pytest-homeassistant-custom-component

      - name: Show resolved versions
        run: |
          pip show homeassistant pytest-homeassistant-custom-component \
            | grep -E "^(Name|Version)"

      - name: Run pytest
        run: pytest tests/ -v
