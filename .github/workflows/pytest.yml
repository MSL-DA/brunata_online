name: Pytest

on:
  push:
    branches:
      - "main"
      - "beta"
  pull_request:
    branches:
      - "main"
      - "beta"
  schedule:
    # Catches a new Home Assistant release breaking the integration even when
    # nothing has been pushed here.
    - cron: "0 4 * * *"

jobs:
  pinned:
    name: "Pinned"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Run pytest
        run: pytest tests/ -v

  latest:
    name: "Latest Home Assistant"
    runs-on: ubuntu-latest
    # A new Home Assistant release can turn this red without anything changing
    # in this repository, so it reports rather than blocks. When it fails, fix
    # the integration and bump the pin in requirements_test.txt.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade pytest-homeassistant-custom-component

      - name: Show resolved versions
        run: |
          pip show homeassistant pytest-homeassistant-custom-component \
            | grep -E "^(Name|Version)"

      - name: Run pytest
        run: pytest tests/ -v
