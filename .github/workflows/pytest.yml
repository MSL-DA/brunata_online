---
name: Pytest

on:
  push:
    branches:
      - "main"
      - "beta"
  pull_request:
    branches:
      - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: "Pytest"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      # The pin in requirements_test.txt decides which Home Assistant this runs
      # against, and it is not stated anywhere in the log otherwise. When a
      # failure has to be explained six months later, that version is the first
      # thing anyone looks for. pytest-latest.yml has carried this step from
      # the start; the blocking workflow needs it more, not less.
      - name: Show resolved versions
        run: |
          pip show homeassistant pytest-homeassistant-custom-component \
            | grep -E "^(Name|Version)"

      - name: Run pytest
        run: pytest tests/ -v
