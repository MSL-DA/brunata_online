name: Pytest

on:
  push:
    branches:
      - "main"
      - "beta"
  pull_request:
    branches:
      - "main"
      - "beta"

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two pins: the minimum HA version declared in hacs.json and the
        # current development pin. This catches regressions against both
        # endpoints without requiring a full version matrix.
        #
        # To find the pytest-homeassistant-custom-component pin for a specific
        # HA release, look up the matching tag on GitHub:
        #   https://github.com/MatthewFlamm/pytest-homeassistant-custom-component/releases
        # Each release note states "homeassistant version: X.Y.Z".
        #
        # When bumping the minimum in hacs.json, update the first pin here.
        phcc_version:
          - "0.13.299"   # HA 2025.12.0  (minimum declared in hacs.json)
          - "0.13.356"   # current development pin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest-homeassistant-custom-component==${{ matrix.phcc_version }}

      - name: Run pytest
        run: pytest tests/ -v
