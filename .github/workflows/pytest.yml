name: Pytest

on:
  push:
    branches:
      - "main"
      - "beta"
  pull_request:
    branches:
      - "main"
      - "beta"

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The matrix declares Home Assistant versions, not
        # pytest-homeassistant-custom-component versions.
        #
        # Every phcc release pins one exact homeassistant release as a
        # dependency, so pinning homeassistant here lets pip resolve the
        # matching phcc release by itself. That removes the phcc-to-HA lookup
        # table this file used to carry, which was a standing source of error:
        # the two version schemes look nothing alike, and a wrong pin fails
        # silently by testing the wrong version green.
        #
        # Python is paired with each entry rather than set once, because the
        # Python version a Home Assistant release supports moves over time.
        # Installing a release on an unsupported Python fails at the pip step.
        #
        # First entry must match "homeassistant" in hacs.json — that is the
        # version advertised to every HACS user, and this job is what makes the
        # promise true. tests/test_manifest.py asserts the two agree.
        include:
          - ha_version: "2025.8.0"    # minimum in hacs.json (OptionsFlowWithReload)
            python_version: "3.13"
          - ha_version: "2026.8.2"    # current, matches requirements_test.txt
            python_version: "3.14"

    name: "HA ${{ matrix.ha_version }} (py${{ matrix.python_version }})"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python_version }}"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "homeassistant==${{ matrix.ha_version }}" \
            pytest-homeassistant-custom-component

      - name: Show resolved versions
        run: |
          pip show homeassistant pytest-homeassistant-custom-component \
            | grep -E "^(Name|Version)"

      - name: Run pytest
        run: pytest tests/ -v
