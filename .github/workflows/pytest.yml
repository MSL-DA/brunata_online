---
name: Pytest

on:
  push:
    branches:
      - "main"
      - "beta"
  pull_request:
    branches:
      - "main"
      - "beta"

# None of these jobs write anything back to the repository: they check out,
# install and run. Declaring the token read-only means a compromised action in
# the chain cannot push, tag or open anything either. release.yml has said this
# since it was written; the others inherited whatever the repository default
# happened to be.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: "Pytest"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      # The pin in requirements_test.txt decides which Home Assistant this runs
      # against, and it is not stated anywhere in the log otherwise. When a
      # failure has to be explained six months later, that version is the first
      # thing anyone looks for. pytest-latest.yml has carried this step from
      # the start; the blocking workflow needs it more, not less.
      # shell: bash, not the default, because only an explicit bash shell
      # runs with pipefail. Without it the step's result is grep's: pip show
      # exits 1 for a package that is not installed, grep still finds the
      # other one, and the step is green while showing half of what it is for.
      - name: Show resolved versions
        shell: bash
        run: |
          pip show homeassistant pytest-homeassistant \
            | grep -E "^(Name|Version)"

      - name: Run pytest
        run: pytest tests/ -v
