jobs:
  get-python-version:
    name: Get Python version
    runs-on: ubuntu-latest
    outputs:
      python-version: ${{ steps.get-version.outputs.python-version }}
    steps:
      - name: Get Python version from HA Core
        id: get-version
        run: |
          VERSION=$(curl -s https://raw.githubusercontent.com/home-assistant/core/dev/.python-version)
          echo "python-version=$VERSION" >> $GITHUB_OUTPUT

  pytest:
    name: Run tests
    runs-on: ubuntu-latest
    needs: get-python-version
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.get-python-version.outputs.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Run pytest
        run: |
          pytest tests/ -v