name: Release

# HACS serves whatever manifest.json says, not what the tag says. A tag pushed
# with a stale version number produces a release users can install but that
# Home Assistant then reports as the previous version — and HACS will not offer
# the next update, because as far as it can tell they already have it.
#
# Nothing else in CI checks this: pytest.yml and hassfest.yml run on the branch,
# where the tag does not exist yet. So it is checked here, at the one moment
# both numbers are known.
#
# This workflow also *creates* the release, and that is the point. A check that
# only reports cannot stop anything: HACS installs from the GitHub release, and
# a release made in the web UI already exists by the time a workflow triggered
# by its tag gets to run. Failing afterwards is a notification, not a guard.
# Creating the release here puts the check in front of it, so a mismatched
# version means no release at all.
#
#   Cut a release by pushing a tag:  git tag v1.4.0 && git push origin v1.4.0
#   Do not create releases from the web UI — that skips this check.

on:
  push:
    tags:
      - "v*"

# contents: write is required to create the release. It is the only elevated
# permission here, and the job does nothing else with it.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Explicit rather than relying on whatever Python the runner image
      # happens to put on PATH. This job runs once per release and never in
      # the normal cycle, so a surprise here would surface at the worst
      # possible moment.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Compare the tag with manifest.json
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python -c "import json; print(json.load(open('custom_components/brunata/manifest.json'))['version'])")

          echo "Tag:      $GITHUB_REF_NAME (version $tag)"
          echo "Manifest: $manifest"

          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json ($manifest). Bump manifest.json, or delete and re-push the tag."
            exit 1
          fi

          # A version with a hyphen is a pre-release under semantic versioning
          # (1.4.0-beta.1). Marking it as one keeps HACS from offering it to
          # users who have not opted into betas.
          if [ "${tag#*-}" != "$tag" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            ${{ steps.version.outputs.prerelease == 'true' && '--prerelease' || '' }}
