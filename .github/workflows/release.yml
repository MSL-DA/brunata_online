---
name: Release

# Checks that the tag matches manifest.json and attaches brunata.zip, which
# the Marketplace installs from (zip_release in hacs.json). Runs after the
# release exists, so it can report but not block. To attach the file again:
# Actions → Release → Run workflow, with the tag.

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of an existing release, with the v (e.g. v1.6.3)"
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  version:
    name: Tag matches manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Compare the tag with manifest.json
        run: |
          version="${TAG#v}"
          manifest=$(python -c "import json; print(json.load(open('custom_components/brunata/manifest.json'))['version'])")

          echo "Tag:      $TAG (version $version)"
          echo "Manifest: $manifest"

          if [ "$version" != "$manifest" ]; then
            echo "::error::Tag $TAG does not match manifest.json ($manifest)."
            exit 1
          fi

  asset:
    name: Attach brunata.zip
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Files at the root of the archive, not under custom_components/brunata/.
      - name: Build brunata.zip
        run: |
          cd custom_components/brunata
          zip -r -X "$RUNNER_TEMP/brunata.zip" . -x "*__pycache__*"

      - name: Check the archive
        run: |
          python - "$RUNNER_TEMP/brunata.zip" <<'EOF'
          import json
          import os
          import sys
          import zipfile

          archive = zipfile.ZipFile(sys.argv[1])
          names = set(archive.namelist())
          missing = [n for n in ("manifest.json", "__init__.py") if n not in names]
          if missing:
              sys.exit(f"::error::brunata.zip has no {', '.join(missing)} at its root")

          version = json.loads(archive.read("manifest.json"))["version"]
          expected = os.environ["TAG"].removeprefix("v")
          if version != expected:
              sys.exit(f"::error::manifest.json in brunata.zip says {version}, the tag says {expected}")
          EOF

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" "$RUNNER_TEMP/brunata.zip" \
            --repo "$GITHUB_REPOSITORY" --clobber
