---
name: Release

# HACS serves whatever manifest.json says, not what the tag says. A tag pushed
# with a stale version number produces a release users can install but that
# Home Assistant then reports as the previous version — and HACS will not offer
# the next update, because as far as it can tell they already have it.
#
# Nothing else in CI checks this: pytest.yml and hassfest.yml run on the branch,
# where the tag does not exist yet. So it is checked here, at the one moment
# both numbers are known.
#
# This job cannot block the release. HACS installs from the GitHub release, and
# a workflow triggered by the tag always arrives after that release exists. An
# attempt to make it blocking, by having the job create the release itself with
# `gh release create`, failed on two releases in a row: this repo publishes from
# the Releases page, and "Publish release" creates the tag and the release in
# one operation, so the CLI always met a release that already existed and
# returned HTTP 422. The file is back to reporting only.
#
# There is deliberately no `concurrency` block. Every other workflow here has
# one because a branch can collect several pushes; a tag ref is created once and
# never has a competing run to cancel.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version:
    name: Tag matches manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The step below reads manifest.json with Python. Without this it would
      # run on whatever the runner image happens to have on PATH, which is not
      # something this repo controls or gets told about when it changes. Every
      # other workflow here pins the same version.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Compare the tag with manifest.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python -c "import json; print(json.load(open('custom_components/brunata/manifest.json'))['version'])")

          echo "Tag:      $GITHUB_REF_NAME (version $tag)"
          echo "Manifest: $manifest"

          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json ($manifest). Bump manifest.json, or delete and re-push the tag."
            exit 1
          fi
