name: Release

# HACS serves whatever manifest.json says, not what the tag says. A tag pushed
# with a stale version number produces a release users can install but that
# Home Assistant then reports as the previous version — and HACS will not offer
# the next update, because as far as it can tell they already have it.
#
# Nothing else in CI checks this: pytest.yml and hassfest.yml run on the branch,
# where the tag does not exist yet. So it is checked here, at the one moment
# both numbers are known.
#
# This workflow only reports, and that is deliberate. Releases are published
# from the web UI, and publishing creates the tag in the same operation — so by
# the time this runs, the release already exists and nothing here can stop it.
# A red tick means "the release you just published carries the wrong version
# number": fix manifest.json, then delete the release and its tag and publish
# again.
#
# An earlier version had this job create the release itself, which would have
# made the check blocking. It also made publishing from the UI fail every time,
# because gh release create found a release already there. Reporting is the
# most a check can do without taking the publishing over, and taking it over is
# not worth the change in workflow.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Tag matches manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Explicit rather than relying on whatever Python the runner image
      # happens to put on PATH. This job runs once per release and never in
      # the normal cycle, so a surprise here would surface at the worst
      # possible moment.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Compare the tag with manifest.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python -c "import json; print(json.load(open('custom_components/brunata/manifest.json'))['version'])")

          echo "Tag:      $GITHUB_REF_NAME (version $tag)"
          echo "Manifest: $manifest"

          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json ($manifest). Fix manifest.json, then delete this release and its tag and publish again."
            exit 1
          fi
