---
name: Lint

on:
  push:
    branches:
      - "main"
      - "beta"
  pull_request:
    branches:
      - "main"
      - "beta"

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.14.2

      - name: Run ruff
        run: ruff check --output-format=github .
