---
name: Backfill release assets

# One-off. hacs.json sets zip_release, so the Marketplace installs every
# release from its brunata.zip asset — including older releases a user picks
# by hand. Releases published before release.yml attached that asset have none,
# and cannot be installed. This builds brunata.zip from each such release's own
# tag and attaches it, so every release can be installed again.
#
# The archive is built with `git archive <tag>:custom_components/brunata`, which
# puts the files at the root of the zip — the same layout release.yml produces —
# from exactly what was tagged, not from the current branch.
#
# Safe to run more than once: releases that already have brunata.zip are left
# alone. Run it once from the Actions tab, check the output, then delete this
# file rather than leaving a write-capable workflow in the repository.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    name: Attach brunata.zip to older releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build and attach missing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          failed=0

          # Assigned first, not looped over directly: a failing command
          # substitution in a for-list does not trip `set -e`, and the job
          # would end green having done nothing.
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" \
            --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName')
          if [ -z "$tags" ]; then
            echo "::error::No releases found"
            exit 1
          fi

          for tag in $tags; do
            # Captured rather than piped into `grep -q`: with pipefail, grep
            # exiting early can fail the pipe and misread an existing asset as
            # missing.
            assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name')
            if grep -qx 'brunata.zip' <<< "$assets"; then
              echo "$tag: already has brunata.zip"
              continue
            fi

            if ! git cat-file -e "$tag:custom_components/brunata/manifest.json" 2>/dev/null; then
              echo "::warning::$tag: no custom_components/brunata/manifest.json in the tag, skipped"
              continue
            fi

            git archive --format=zip -o "$RUNNER_TEMP/brunata.zip" \
              "$tag:custom_components/brunata"

            if gh release upload "$tag" "$RUNNER_TEMP/brunata.zip" \
                --repo "$GITHUB_REPOSITORY"; then
              echo "$tag: attached brunata.zip"
            else
              echo "::error::$tag: upload failed"
              failed=1
            fi
            rm -f "$RUNNER_TEMP/brunata.zip"
          done

          exit "$failed"
