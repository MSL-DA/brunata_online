name: Find minimum Home Assistant version

# One-off, manual-only workflow. Not wired to push/PR — it exists purely to
# answer one question: which of these monthly Home Assistant releases is the
# oldest the integration actually imports and runs on?
#
# The version pins in the matrix below are already filled in (matched against
# pytest-homeassistant-custom-component's PyPI release history by date — see
# https://pypi.org/project/pytest-homeassistant-custom-component/#history).
# One entry (2025.2.0) is flagged as a best-effort guess rather than a
# confirmed match; the rest are exact.
#
# READING THE RESULTS
# -------------------
# Only two kinds of failure answer the question:
#   * ImportError / AttributeError on a homeassistant.* name — that release
#     genuinely lacks a core API the code uses. This is the real floor.
#   * A test assertion failing — behaviour differs on that release.
#
# Anything failing during `pip install` is about PyPI, not about this code:
# no wheel for the interpreter, a build-from-source that needs a toolchain,
# a resolver conflict between an old release's loosely pinned indirect
# dependencies and whatever is newest on PyPI today. Those say nothing about
# whether the integration would run on a user's Home Assistant, where every
# dependency is locked in the container image. Ignore them, or note that
# month as "not determinable from PyPI today".
#
# WHEN YOU'RE DONE
# ----------------
# Commit this file to .github/workflows/, push it, then trigger it manually
# from the Actions tab ("Run workflow"). Every month runs independently
# (fail-fast: false), so one failing job doesn't stop the others — you'll get
# a single clear picture of exactly where it starts failing. The oldest
# month whose job is green is your real minimum.
#
# Delete this file once you have your answer and have updated hacs.json
# accordingly — it has no purpose beyond this one-time check.

on:
  workflow_dispatch:

jobs:
  bisect:
    name: "HA ${{ matrix.ha_month }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # month label is just for the readable job name above; the phcc
          # pin is what actually selects the Home Assistant version.
          #
          # Pins found by matching each HA monthly stable release date
          # against pytest-homeassistant-custom-component's daily PyPI
          # release history. Most land on the exact release date; where
          # phcc has no build on that exact day, the next day's build is
          # used instead (it still carries that HA version).
          - ha_month: "2025.2.0"
            # Best-effort: I could not confirm 2025.2.0's exact release date
            # with certainty, so this pin (Feb 6, 2025 build) is a good guess,
            # not a verified match like the others below. Worth double-
            # checking on the releases page before relying on this one.
            phcc_version: "0.13.210"
          - ha_month: "2025.3.0"
            phcc_version: "0.13.221"
          - ha_month: "2025.4.0"
            phcc_version: "0.13.232"
          - ha_month: "2025.5.0"
            phcc_version: "0.13.244"
          - ha_month: "2025.6.0"
            phcc_version: "0.13.251"
          - ha_month: "2025.7.0"
            phcc_version: "0.13.260"
          - ha_month: "2025.8.0"
            phcc_version: "0.13.270"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # 3.13, NOT the 3.14 the other workflows use. Home Assistant 2025.8
          # runs on 3.13 (which is why ruff.toml targets py313), and the
          # dependencies these older releases pin only publish wheels up to
          # 3.13. On 3.14 pip falls back to building pydantic-core from
          # source, which fails because PyO3 0.24.1 doesn't support 3.14 —
          # a failure about PyPI and wheel availability, not about this code.
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pytest-homeassistant-custom-component==${{ matrix.phcc_version }}"

      - name: Show resolved Home Assistant version
        run: |
          pip show homeassistant pytest-homeassistant-custom-component \
            | grep -E "^(Name|Version)"

      - name: Run pytest
        run: pytest tests/ -v
