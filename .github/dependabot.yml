version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "beta"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Copenhagen"
    # All five workflows use the same two actions, so without grouping a single
    # major bump would open one pull request per file.
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  # pip covers requirements_lint.txt, which is where the Ruff pin now lives. It
  # used to be a `pip install ruff==...` argument inside lint.yml, which
  # Dependabot cannot see at all, so the pin simply aged.
  #
  # pytest-homeassistant-custom-component is excluded below. It is not an
  # ordinary dependency: it decides which Home Assistant version CI tests
  # against, and pytest-latest.yml already reports when a newer Home Assistant
  # breaks something. That pin is bumped by hand, with a reason, rather than
  # weekly by a bot.
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "beta"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Copenhagen"
    ignore:
      - dependency-name: "pytest-homeassistant-custom-component"
    commit-message:
      prefix: "ci"
