version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "beta"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Copenhagen"
    cooldown:
      default-days: 3
    # Every workflow here uses the same handful of actions, so without grouping
    # a single major bump would open one pull request per file.
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  # Covers requirements_lint.txt (the Ruff pin) and requirements_test.txt,
  # where homeassistant is pinned directly. cooldown is written out here
  # because it would otherwise be inherited from a repository setting, visible
  # only in the Dependabot job log.
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "beta"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Copenhagen"
    cooldown:
      default-days: 3
      semver-patch-days: 0
    commit-message:
      prefix: "ci"
