version: 2

updates:
  # Only github-actions. The pip ecosystem is deliberately left out:
  # requirements_test.txt pins pytest-homeassistant-custom-component, and that
  # pin is not an ordinary dependency — it decides which Home Assistant version
  # CI tests against. pytest-latest.yml already reports when a newer Home
  # Assistant breaks something, so the pin is bumped by hand, with a reason,
  # rather than weekly by a bot. Note also that ruff is pinned inside lint.yml
  # as a pip install argument, which Dependabot cannot see either way.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "beta"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Copenhagen"
    # All five workflows use the same two actions, so without grouping a single
    # major bump would open one pull request per file.
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
