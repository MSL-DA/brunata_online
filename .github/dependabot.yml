version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "beta"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Copenhagen"
    # All five workflows use the same two actions, so without grouping a single
    # major bump would open one pull request per file.
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  # pip covers requirements_lint.txt, which is where the Ruff pin now lives. It
  # used to be a `pip install ruff==...` argument inside lint.yml, which
  # Dependabot cannot see at all, so the pin simply aged.
  #
  # It also covers requirements_test.txt, where homeassistant is pinned
  # directly (see that file). A weekly pull request for it therefore reads
  # "Bump homeassistant from 2026.8.2 to 2026.9.0" — the version you would
  # actually recognise — instead of a pytest-homeassistant-custom-component
  # build number. pytest-latest.yml already reports separately when a newer
  # Home Assistant breaks something; this is what turns that report into a
  # ready pull request. Merge it when you want to move the floor, leave it
  # otherwise — it is not required to pass.
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "beta"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Copenhagen"
    commit-message:
      prefix: "ci"
