name: Bug report
description: Something in the integration isn't working
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        The single most useful thing you can attach is a **diagnostics report**:
        Settings → Devices & services → Brunata → three-dot menu →
        *Download diagnostics*. Your email, password and meter numbers are
        removed before the file is written.

        If the integration won't start, or keeps asking you to log in, a
        diagnostics report can't be produced — attach a debug log instead. Both
        are explained in
        [Debugging](https://github.com/MSL-DA/brunata_online/wiki/Debugging).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Integration version
      description: HACS shows this on the Brunata card.
      placeholder: "1.4.0"
    validations:
      required: true

  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      description: Settings → About.
      placeholder: "2026.8.2"
    validations:
      required: true

  - type: dropdown
    id: regression
    attributes:
      label: Did this used to work?
      options:
        - "No — it has never worked for me"
        - "Yes — it broke after updating the integration"
        - "Yes — it broke after updating Home Assistant"
        - "Yes — it broke on its own"
        - "I don't know"
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report or debug log
      description: |
        Drag the file into this box, or paste the relevant part.

        Issues are public. The report keeps your meter readings and the room
        labels you set in Brunata Online — not sensitive in the way a password
        is, but yours. Have a look before uploading if you'd rather not
        publish them.
    validations:
      required: false

  - type: textarea
    id: meters
    attributes:
      label: Which meters are affected?
      description: >
        Meter type and unit as shown in Home Assistant, e.g. "Water, m³" or
        "Radiator, units". Say if only some of your meters are affected — that
        is often the clue.
    validations:
      required: false
