name: Meter support request
description: A meter on your account gets no entity in Home Assistant
title: "Meter support: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Only water, heat cost allocators and electricity meters get entities
        today. Brunata sends the meter type as a number, and adding one more
        number is a small change — it just needs someone who has that meter.

        If a sensor you already have stopped updating or shows 0, use the bug
        report instead.

  - type: textarea
    id: log-line
    attributes:
      label: The log line naming your meter type
      description: |
        1. Settings → Devices & services → Brunata → three-dot menu → *Enable debug logging*
        2. Restart Home Assistant — the line is only written at startup
        3. Search the log for `meterType`

        Where the log is:
        [Debugging](https://github.com/MSL-DA/brunata_online/wiki/Debugging).

        No line at all? Then Brunata has probably marked the meter as
        dismounted. Write that here instead.
      placeholder: Meter 1234567 has meterType 4, which this integration does not support, ...
    validations:
      required: true

  - type: input
    id: measures
    attributes:
      label: What does the meter measure?
      description: Gas, district heating, hot water — whatever the box on the wall is.
    validations:
      required: true

  - type: input
    id: unit
    attributes:
      label: Unit shown in Brunata Online
      placeholder: m³, kWh, GJ, ...
    validations:
      required: true

  - type: input
    id: readings
    attributes:
      label: Two readings a few days apart
      description: Shows whether the number counts upward or moves both ways.
      placeholder: "12 Sep: 4512.8 — 15 Sep: 4530.1"
    validations:
      required: true

  - type: dropdown
    id: testing
    attributes:
      label: Can you test a pre-release?
      description: Nobody here has your meter, so it has to be confirmed on yours.
      options:
        - "Yes"
        - "Yes, but not right away"
        - "No"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Integration version
      description: HACS shows this on the Brunata card.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      description: >
        Optional. Brunata → three-dot menu → *Download diagnostics*. Your
        email, password and meter numbers are removed; your readings and room
        labels are not, and issues are public.
    validations:
      required: false
