name: Meter support request
description: A meter on your account gets no entity in Home Assistant
title: "Meter support: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Only water, heat cost allocator and electricity meters get entities.
        Adding another type needs the log line below, and someone with that
        meter to confirm it.

  - type: textarea
    id: log-line
    attributes:
      label: Log line naming the meter type
      description: |
        Enable debug logging on the integration, restart Home Assistant, then
        search the log for `meterType`.
      placeholder: Meter 1234567 has meterType 4, which this integration does not support, ...
    validations:
      required: true

  - type: textarea
    id: meter
    attributes:
      label: The meter
      description: >
        What it measures, the unit shown in Brunata Online, and two readings
        a few days apart.
      placeholder: |
        Gas meter, unit m³
        12 Sep: 4512.8 — 15 Sep: 4530.1
    validations:
      required: true

  - type: dropdown
    id: testing
    attributes:
      label: Can you test a pre-release?
      options:
        - "Yes"
        - "No"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Integration version
    validations:
      required: true
