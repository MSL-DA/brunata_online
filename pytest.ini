[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
# Set explicitly because pytest-asyncio warns on every run when it is not.
# "function" is the value the warning names as the future default, and it is
# what these tests already assume: each one gets its own hass fixture and its
# own loop.
asyncio_default_fixture_loop_scope = function
# Required by pytest-homeassistant: respx's own pytest plugin must not load
# before Home Assistant installs its httpx alias. Home Assistant's HTTP mocks
# still use respx directly; only the separate plugin is switched off.
addopts = -p no:respx
